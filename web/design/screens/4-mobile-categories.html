</span>
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 14px; line-height: 18px; font-weight: 700">{{c.ms}}</span>
<span style="font-size: 11px; line-height: 14px; color: #5B6474">{{c.en}}</span>
