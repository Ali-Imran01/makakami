<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>

<style>

</style>
</helmet>
<div style="background: #F6F5F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0E1420">

<header style="background: #FFFFFF; border-bottom: 1px solid #E3E1DA">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<a href="WebHome.dc.html" style="font-size: 24px; font-weight: 800; color: #0B2E6B; letter-spacing: -0.02em; text-decoration: none">MakaKami</a>
<nav aria-label="Utama" style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px; font-weight: 600">

<a href="WebHome.dc.html" style="text-decoration: none; color: #0E1420">Cara ia berfungsi</a>
<a href="#" style="text-decoration: none; color: #0E1420">Tentang</a>

<div style="flex: 1 1 240px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: #F6F5F1; border: 1px solid #E3E1DA; border-radius: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6474" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="cari-nav2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari produk</label>
<input id="cari-nav2" type="search" placeholder="Cari produk, jenama atau kod bar" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; color: #0E1420">
</div>
<div style="display: flex; align-items: center; gap: 10px">
<a href="#" style="height: 40px; padding: 0 16px; display: flex; align-items: center; border-radius: 999px; border: 1px solid #E3E1DA; text-decoration: none; color: #0E1420; font-size: 14px; font-weight: 700">Log masuk</a>
<a href="#" style="height: 40px; padding: 0 16px; display: flex; align-items: center; border-radius: 999px; background: #F5C400; text-decoration: none; color: #0B2E6B; font-size: 14px; font-weight: 800">Muat turun APK</a>
</div>
</div>
</header>

<div style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 24px">
<nav aria-label="Laluan" style="font-size: 13px; color: #5B6474; display: flex; gap: 8px">
<a href="WebHome.dc.html" style="text-decoration: none">Utama</a><span>›</span><a href="#" style="text-decoration: none">Kategori</a><span>›</span><span style="color: #0E1420; font-weight: 600">Makanan</span>
</nav>

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 36px; line-height: 42px; font-weight: 800; letter-spacing: -0.02em">Makanan</h1>
<p style="margin: 4px 0 0; font-size: 15px; color: #5B6474">[Bilangan] produk Malaysia · snek, makanan segera, sos, rempah dan banyak lagi</p>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<label for="susun" style="font-size: 14px; font-weight: 600; color: #5B6474">Susun</label>
<select id="susun" style="height: 40px; padding: 0 12px; border: 1px solid #E3E1DA; border-radius: 8px; background: #FFFFFF; font-size: 14px; color: #0E1420">
<option>Paling popular</option><option>Terbaru</option><option>A–Z</option>
</select>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<aside aria-label="Penapis" style="flex: 1 1 240px; max-width: 280px; display: flex; flex-direction: column; gap: 20px; padding: 20px; background: #FFFFFF; border: 1px solid #E3E1DA; border-radius: 16px; box-sizing: border-box">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Tapis</h2>
<button style="border: 0; background: transparent; color: #0B2E6B; font-size: 13px; font-weight: 700; padding: 6px 0">Set semula</button>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0 0 10px; font-size: 13px; font-weight: 700; color: #5B6474">Subkategori</legend>
<sc-for list="{{ subs }}" as="s" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 28px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B2E6B">{{s}}</label>
</sc-for>
</fieldset>
<fieldset style="margin: 0; padding: 16px 0 0; border: 0; border-top: 1px solid #E3E1DA; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 16px 0 10px; font-size: 13px; font-weight: 700; color: #5B6474; float: left; width: 100%">Status asal</legend>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 28px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B2E6B">Buatan Malaysia</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 28px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B2E6B">Mungkin Malaysia</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 28px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B2E6B">Belum disahkan</label>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3E1DA">
<label for="negeri" style="font-size: 13px; font-weight: 700; color: #5B6474">Negeri pengilang</label>
<select id="negeri" style="height: 40px; padding: 0 10px; border: 1px solid #E3E1DA; border-radius: 8px; background: #FFFFFF; font-size: 14px; color: #0E1420"><option>Semua negeri</option><option>Johor</option><option>Kelantan</option><option>Perak</option><option>Selangor</option><option>Terengganu</option></select>
</div>
<label style="display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid #E3E1DA; font-size: 14px; font-weight: 600">Halal sahaja<input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B2E6B"></label>
</aside>

<div style="flex: 999 1 480px; display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px">
<sc-for list="{{ items }}" as="p" hint-placeholder-count="8">
<a href="Result.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #FFFFFF; border: 1px solid #E3E1DA; border-radius: 16px; text-decoration: none; color: #0E1420">
<span style="height: 160px; border-radius: 8px; background: #EEECE6; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5B6474">[Foto]</span>
<span style="font-size: 15px; line-height: 20px; font-weight: 700">{{p.name}}</span>
<span style="font-size: 13px; color: #5B6474">[Jenama] · {{p.state}}</span>
<sc-if value="{{ p.verified }}" hint-placeholder-val="{{ true }}">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: #14804A; color: #FFFFFF; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Buatan MY</span>
</sc-if>
<sc-if value="{{ p.likely }}" hint-placeholder-val="{{ false }}">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; border: 1.5px solid #14804A; color: #14804A; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#14804A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Mungkin MY</span>
</sc-if>
</a>
</sc-for>
</div>
<nav aria-label="Halaman" style="display: flex; justify-content: center; gap: 6px">
<a href="#" aria-current="page" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #0B2E6B; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 700">1</a>
<a href="#" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid #E3E1DA; background: #FFFFFF; color: #0E1420; text-decoration: none; font-size: 14px; font-weight: 600">2</a>
<a href="#" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid #E3E1DA; background: #FFFFFF; color: #0E1420; text-decoration: none; font-size: 14px; font-weight: 600">3</a>
<a href="#" style="height: 40px; padding: 0 16px; display: flex; align-items: center; border-radius: 999px; border: 1px solid #E3E1DA; background: #FFFFFF; color: #0E1420; text-decoration: none; font-size: 14px; font-weight: 600">Seterusnya</a>
</nav>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
const p = (name, state, v) => ({ name, state, verified: v, likely: !v });
return {
subs: ['Snek', 'Makanan segera', 'Sos & perencah', 'Rempah & pes', 'Beku'],
items: [
p('Kerepek Pisang Pedas', 'Perak', true),
p('Sambal Bilis Botol', 'Johor', false),
p('Mi Segera Kari', 'Selangor', true),
p('Kicap Manis', 'Pulau Pinang', true),
p('Rempah Kari Daging', 'Kelantan', false),
p('Keropok Lekor Beku', 'Terengganu', true),
p('Serunding Daging', 'Kelantan', true),
p('Pes Tom Yam', 'Kedah', false)
]
};
}
}
</script>
</body>
</html>
